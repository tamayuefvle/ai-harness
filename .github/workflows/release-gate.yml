name: Production Release Gate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Existing REL-* record"
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify approved release record
        run: node scripts/harness/release-gate-verify.mjs --id "${{ inputs.release_id }}" --state PRODUCTION_APPROVED
      - name: External deployment boundary
        run: echo "Release gate verified. This workflow intentionally does not deploy; connect an approved provider workflow separately."
