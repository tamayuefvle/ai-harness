name: E2E Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify npm CI project state
        id: project-state
        shell: bash
        run: bash scripts/harness/ci-project-state.sh

      - name: Harness bootstrap notice
        if: ${{ steps.project-state.outputs.state == 'bootstrap' }}
        run: echo "::notice title=Harness bootstrap::E2E is skipped only for this harness-only root commit. Add package.json and one npm lockfile in the next commit."

      - name: Setup Node
        if: ${{ steps.project-state.outputs.state == 'ready' }}
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ steps.project-state.outputs.lockfile }}

      - name: Clean install
        if: ${{ steps.project-state.outputs.state == 'ready' }}
        run: npm ci

      - name: Install Playwright
        if: ${{ steps.project-state.outputs.state == 'ready' }}
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: ${{ steps.project-state.outputs.state == 'ready' }}
        run: npm run verify:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ always() && steps.project-state.outputs.state == 'ready' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
